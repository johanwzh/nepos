<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nepos</title>
  </head>
  <body>
    <div id="app">

      <div id="topbar">
        <span class="tb-brand">Nepos</span>
        <span class="tb-ver" id="el-ver"></span>
        <div class="tb-sep"></div>
        <nav id="menubar"></nav>
        <button id="delivery-btn"></button>
        <div class="tb-spacer"></div>
      </div>
      <div class="n2-banner" id="sample-banner" data-lk="sampleMode" hidden></div>

      <div id="tabbar">
        <div class="tab tab-toggle" id="tab-map"><span class="fk">Alt+1</span><span data-lk="tabMap"></span></div>
        <div class="tab active" data-page="edit"><span class="fk">Alt+2</span><span data-lk="tabEdit"></span></div>
        <div class="tab" data-page="lines"><span class="fk">Alt+3</span><span data-lk="tabLines"></span></div>
        <div class="tab" data-page="assets"><span class="fk">Alt+4</span><span data-lk="tabAssets"></span></div>
        <div class="tab" data-page="export"><span class="fk">Alt+5</span><span data-lk="tabExport"></span></div>
      </div>

      <div id="pages">

        <div id="page-edit" class="page active">
          <div id="panel-right" class="side-panel">
            <div class="panel-hdr">
              <span class="panel-hdr-title" data-lk="panelMap"></span>
              <span class="panel-close" id="close-right" title="Alt+1">✕</span>
            </div>
            <div id="sp" class="sp" hidden>
              <div class="sp-head"><span id="sp-head"></span></div>
              <input type="text" id="sp-q" autocomplete="off" spellcheck="false">
              <label class="n2-check sp-mode"><input type="checkbox" id="sp-only-mode" checked> <span id="sp-only-mode-label"></span></label>
              <div class="sp-status" id="sp-status"></div>
              <div class="sp-list" id="sp-list"></div>
              <div class="sp-card" id="sp-card" hidden></div>
              <button class="pop-btn" id="sp-clear" data-lk="spClear"></button>
            </div>
            <div id="map-inner">
              <div id="leaflet-map" class="n2-tiles"></div>
              <div class="map-hint-overlay"><div class="map-hint" data-lk="mapHint"></div></div>
              <div class="n2-map-missing" id="map-missing" hidden></div>
            </div>
          </div>

          <div class="rz-handle" id="rh-right" data-side="right"></div>

          <div id="edit-main">
            <div id="route-hdr"><span class="rh-hint" id="rh-hint"></span></div>
            <div id="ts-tabs" class="ts-tabs"></div>
            <div id="kom-bar" style="display:none"></div>
            <div id="grid-status"></div>
            <div id="grid-wrap" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
              <div class="grid-placeholder" id="grid-ph">
                <strong id="grid-ph-h"></strong>
                <span id="grid-ph-s"></span>
                <div class="n2-ph-actions" id="grid-ph-actions"></div>
                <div class="n2-route-info" id="grid-ph-info"></div>
              </div>
              <div id="tbl-wrap" style="display:none"><table id="tbl"></table></div>
            </div>
            <div id="fn-preview"></div>
            <div id="edit-footer"></div>
          </div>


          <div class="rz-handle" id="rh-left" data-side="left"></div>

          <div id="panel-left" class="side-panel">
            <div class="panel-hdr">
              <span class="panel-hdr-title" data-lk="panelRoutes"></span>
              <span class="panel-close" id="close-left" title="Alt+3">⤢</span>
            </div>
            <div class="route-list" id="route-list"></div>
          </div>
        </div>

        <div id="page-lines" class="page">
          <div id="line-table" class="line-table"></div>
        </div>

        <div id="page-assets" class="page">
          <div class="assets-nav">
            <div class="assets-nav-item active" data-sec="orgs"><span data-lk="orgTitle"></span></div>
            <div class="assets-nav-item" data-sec="brandings"><span data-lk="brandTitle"></span></div>
            <div class="assets-nav-item" data-sec="calendars"><span data-lk="calTitle"></span></div>
          </div>
          <div class="assets-body" id="assets-body"></div>
        </div>

        <div id="page-export" class="page">
          <div class="exp-section">
            <div class="exp-title" data-lk="validateTitle"></div>
            <p class="exp-desc" data-lk="validateDesc"></p>
            <div class="val-box" id="val-results"></div>
          </div>
          <div class="exp-section">
            <div class="exp-title" data-lk="exportTitle"></div>
            <p class="exp-desc" data-lk="exportDesc"></p>
            <label class="n2-check"><input type="checkbox" id="chk-zip"> <span data-lk="exportAsZip"></span></label>
            <fieldset class="n2-org-mode">
              <legend data-lk="orgModeTitle"></legend>
              <label class="n2-check"><input type="radio" name="org-mode" id="org-mode-codespace" value="codespace"> <span data-lk="orgModeCodespace"></span></label>
              <label class="n2-check"><input type="radio" name="org-mode" id="org-mode-nog" value="nog"> <span data-lk="orgModeNog"></span></label>
              <small class="n2-org-mode-help" data-lk="orgModeNogHelp"></small>
            </fieldset>
            <button class="exp-btn primary" id="btn-netex"><span class="ico">↓</span><span data-lk="exportNetex"></span></button>
            <div class="assets-status" id="export-status"></div>
          </div>
        </div>

      </div>

      <div id="statusbar">
        <span class="sb-item strong" id="sb-proj">Nepos</span>
        <span class="sb-dot" id="sb-dot1" style="display:none"> · </span>
        <span class="sb-item" id="sb-nroutes"></span>
        <span class="sb-dot" id="sb-dot2" style="display:none"> · </span>
        <span class="sb-item strong" id="sb-route"></span>
        <span class="sb-item sb-right" id="sb-save"></span>
      </div>
    </div>

    <div id="delivery-pop">
      <div class="pop-title" data-lk="deliveryTitle"></div>
      <div class="pop-row">
        <label data-lk="fieldName"></label>
        <input type="text" id="pop-name" autocomplete="off">
      </div>
      <div class="pop-row">
        <label data-lk="fieldCodespace"></label>
        <div class="pop-static" id="pop-codespace"></div>
        <div class="pop-note" data-lk="codespaceReadOnly"></div>
      </div>
      <div class="pop-actions">
        <button class="pop-btn" id="pop-cancel" data-lk="cancel"></button>
        <button class="pop-btn primary" id="pop-save" data-lk="save"></button>
      </div>
    </div>

    <div id="fn-editor">
      <div class="fn-hdr">
        <span class="fn-hdr-title" id="fn-title"></span>
        <select id="fn-def-sel"></select>
        <button class="fn-close-btn" id="fn-close">×</button>
      </div>
      <div class="fn-body">
        <div>
          <label class="fn-label" id="fn-text-label"></label>
          <input type="text" class="fn-text-in" id="fn-text" autocomplete="off">
        </div>
        <div>
          <label class="fn-label" id="fn-exc-label"></label>
          <div class="fn-exc-list" id="fn-exc-list"></div>
          <button class="fn-add-exc" id="fn-add-exc"></button>
        </div>
      </div>
      <div class="fn-footer">
        <button class="fn-remove-btn" id="fn-remove"></button>
        <div class="fn-spacer"></div>
        <button class="fn-apply-btn" id="fn-apply"></button>
      </div>
    </div>

    <div id="grid-ctx" style="display:none">
      <div id="gctx-time">
        <div class="gci" id="gc-clear" data-lk="ctxClear"></div>
        <div class="gci" id="gc-offset" data-lk="ctxOffset"></div>
        <div class="gcs"></div>
        <div class="gci" id="gc-interp" data-lk="ctxInterp"></div>
        <div class="gci" id="gc-extrap-fwd" data-lk="ctxExtrapFwd"></div>
        <div class="gci" id="gc-extrap-bwd" data-lk="ctxExtrapBwd"></div>
        <div class="gcs"></div>
        <div class="gci" id="gc-ix-g" data-lk="ctxIxGuaranteed"></div>
        <div class="gci" id="gc-ix-s" data-lk="ctxIxStaySeated"></div>
        <div class="gci red" id="gc-ix-del" data-lk="ctxIxRemove"></div>
        <div class="gcs"></div>
        <div class="gci" id="gc-add-note" data-lk="ctxNote"></div>
      </div>
      <div id="gctx-stop">
        <div class="gci" id="gc-bold"></div>
        <div class="gci" id="gc-sep"></div>
      </div>
      <div id="gctx-dc">
        <div class="gci" id="gc-dc-note" data-lk="ctxNote"></div>
      </div>
    </div>

    <dialog class="n2-dialog" id="msg-dlg">
      <p id="msg-text"></p>
      <div class="n2-actions"><button class="pop-btn primary" id="msg-close" data-lk="close"></button></div>
    </dialog>


    <dialog class="n2-dialog" id="new-dlg">
      <h2 data-lk="newProjectTitle"></h2>
      <p data-lk="newProjectDesc"></p>
      <label for="new-name" data-lk="projectName"></label>
      <input type="text" id="new-name" autocomplete="off">
      <label for="new-cs" data-lk="fieldCodespace"></label>
      <input type="text" id="new-cs" autocomplete="off" maxlength="3" style="width:80px;text-transform:uppercase">
      <div class="n2-hint" data-lk="codespaceHint"></div>
      <div class="n2-error" id="new-error"></div>
      <div class="n2-actions">
        <button class="pop-btn" id="new-cancel" data-lk="cancel"></button>
        <button class="pop-btn primary" id="new-create" data-lk="create"></button>
      </div>
    </dialog>

    <dialog class="n2-dialog" id="ts-dlg">
      <p><strong data-lk="tsDlgTitle"></strong></p>
      <label class="n2-field"><span data-lk="tsDlgName"></span> <input id="ts-dlg-name"></label>
      <label class="n2-check"><input type="radio" name="ts-stops" id="ts-stops-same" value="same" checked> <span data-lk="tsStopsSame"></span></label>
      <label class="n2-check"><input type="radio" name="ts-stops" value="reversed"> <span data-lk="tsStopsReversed"></span></label>
      <label class="n2-check"><input type="radio" name="ts-stops" value="empty"> <span data-lk="tsStopsEmpty"></span></label>
      <div class="n2-actions"><button class="pop-btn" id="ts-dlg-cancel" data-lk="cancel"></button><button class="pop-btn primary" id="ts-dlg-ok" data-lk="ok"></button></div>
    </dialog>

    <dialog class="n2-dialog" id="per-dlg">
      <p><strong data-lk="newPeriod"></strong></p>
      <p class="n2-dlg-help" data-lk="periodExplain"></p>
      <label class="n2-check"><input type="radio" name="per-start" id="per-copy"> <span id="per-copy-label"></span></label>
      <label class="n2-check"><input type="radio" name="per-start" id="per-empty"> <span data-lk="periodStartEmpty"></span></label>
      <div class="n2-actions"><button class="pop-btn" id="per-cancel" data-lk="cancel"></button><button class="pop-btn primary" id="per-ok" data-lk="ok"></button></div>
    </dialog>

    <dialog class="n2-dialog" id="theme-dlg">
      <p><strong data-lk="themeDlgTitle"></strong></p>
      <label class="n2-field"><span data-lk="themeMain"></span> <input type="color" id="theme-main"></label>
      <label class="n2-check"><input type="checkbox" id="theme-second-on"> <span data-lk="themeSecond"></span> <input type="color" id="theme-second"></label>
      <div class="n2-actions"><button class="pop-btn" id="theme-reset" data-lk="themeReset"></button><button class="pop-btn" id="theme-cancel" data-lk="cancel"></button><button class="pop-btn primary" id="theme-ok" data-lk="ok"></button></div>
    </dialog>

    <dialog class="n2-dialog" id="cal-replace-dlg">
      <p><strong data-lk="calReplaceTitle"></strong></p>
      <p><span id="cal-replace-from"></span> → <label><span data-lk="calReplaceTo"></span> <select id="cal-replace-to"></select></label></p>
      <div class="n2-actions"><button class="pop-btn" id="cal-replace-cancel" data-lk="cancel"></button><button class="pop-btn primary" id="cal-replace-ok" data-lk="calReplaceOk"></button></div>
    </dialog>

    <dialog class="n2-dialog" id="check-dlg">
      <h2 data-lk="integrityTitle"></h2>
      <div id="check-body"></div>
      <div class="n2-actions" id="check-actions"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
